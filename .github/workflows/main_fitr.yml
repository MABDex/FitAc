
name: Build and deploy JAR app to Azure Web App - FITR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'
          cache: maven

      # Baut alle Module über das Root-pom (ChatbotAlge, FrontEnd, Client, Server)
      - name: Build all modules
        run: mvn -B clean package -DskipTests

      # Nur das FrontEnd-JAR für den Deploy-Job hochladen
      - name: Upload FrontEnd jar for deployment
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: 'FrontEnd/target/FrontEnd-0.0.1-SNAPSHOT.jar'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CB2AAD0F035F45AE883FA7AEFBC523E2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DCD34F2F30F24BF894A21B45E3FE070D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3097FD7CA8AD4AD8A9646409F263A46F }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'FITR'
          slot-name: 'Production'
          package: 'FrontEnd-0.0.1-SNAPSHOT.jar'
