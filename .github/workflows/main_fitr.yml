# Build & Deploy Multi-Modul-Java-App (mit FrontEnd) nach Azure Web App FITR

name: Build and deploy JAR app to Azure Web App - FITR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'
          cache: maven

      # --------- 1) Server (reines Java) ----------
      - name: Build McpSpring-Server
        run: mvn -B -f McpSpring-Server/pom.xml clean verify -DskipTests

      # --------- 2) ChatbotAlge (reines Java) -------
      - name: Build ChatbotAlge
        run: mvn -B -f ChatbotAlge/pom.xml clean verify -DskipTests

      # --------- 3) McpSpring-client (Vaadin/Vite) ----------
      - name: Set up Node.js for McpSpring-client
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'McpSpring-client/package-lock.json'

      - name: Install McpSpring-client frontend deps
        working-directory: ./McpSpring-client
        run: npm ci

      - name: Build McpSpring-client
        run: mvn -B -f McpSpring-client/pom.xml clean verify -DskipTests -Dvaadin.ignoreVersionChecks=true

      # --------- 4) FrontEnd (Vaadin/Vite) ------- 
      - name: Set up Node.js for FrontEnd
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'FrontEnd/package-lock.json'

      - name: Install FrontEnd frontend deps
        working-directory: ./FrontEnd
        run: npm ci

      - name: Build FrontEnd
        run: mvn -B -f FrontEnd/pom.xml clean verify -DskipTests -Dvaadin.ignoreVersionChecks=true

      # --------- 5) JAR für Azure bereitstellen (aus FrontEnd) -------
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          # HIER das JAR, das auf Azure laufen soll:
          path: 'FrontEnd/target/*.jar'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write   # required for requesting the JWT
      contents: read    # required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CB2AAD0F035F45AE883FA7AEFBC523E2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DCD34F2F30F24BF894A21B45E3FE070D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3097FD7CA8AD4AD8A9646409F263A46F }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'FITR'
          slot-name: 'Production'
          package: '*.jar'
