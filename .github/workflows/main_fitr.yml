name: Java CI with Maven

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # --------- 1) Zuerst: Server (reines Java) ----------
      - name: Build McpSpring-Server
        run: mvn -B -f McpSpring-Server/pom.xml clean verify -DskipTests

      # --------- 2) Dann: ChatbotAlge (reines Java) -------
      - name: Build ChatbotAlge
        run: mvn -B -f ChatbotAlge/pom.xml clean verify -DskipTests

      # --------- 3) Danach: Client (Vaadin/Vite) ----------
      - name: Set up Node.js for client
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'McpSpring-client/package-lock.json'

      - name: Install client frontend deps
        working-directory: ./McpSpring-client
        run: npm ci

      - name: Build McpSpring-client
        run: mvn -B -f McpSpring-client/pom.xml clean verify -DskipTests -Dvaadin.ignoreVersionChecks=true

      # --------- 4) Zuletzt: FrontEnd (Vaadin/Vite) -------
      - name: Set up Node.js for FrontEnd
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'FrontEnd/package-lock.json'

      - name: Install FrontEnd frontend deps
        working-directory: ./FrontEnd
        run: npm ci

      - name: Build FrontEnd
        run: mvn -B -f FrontEnd/pom.xml clean verify -DskipTests -Dvaadin.ignoreVersionChecks=true

      # --------- 5) FrontEnd-JAR für Deployment speichern -------
      - name: Upload FrontEnd jar for deployment
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: 'FrontEnd/target/FrontEnd-0.0.1-SNAPSHOT.jar'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # nur bei push auf main deployen, nicht bei pull_request
    if: github.event_name == 'push'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CB2AAD0F035F45AE883FA7AEFBC523E2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DCD34F2F30F24BF894A21B45E3FE070D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3097FD7CA8AD4AD8A9646409F263A46F }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'FITR'
          slot-name: 'Production'
          package: 'FrontEnd-0.0.1-SNAPSHOT.jar'
