name: Build and deploy JAR apps to Azure Web App - FITR

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 1) McpSpring-Server bauen
      - name: Build McpSpring-Server
        run: mvn -B -f McpSpring-Server/pom.xml clean verify -DskipTests

      # 2) ChatbotAlge bauen
      - name: Build ChatbotAlge
        run: mvn -B -f ChatbotAlge/pom.xml clean verify -DskipTests

      # 3) McpSpring-client (Vaadin) bauen
      - name: Set up Node.js for McpSpring-client
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'McpSpring-client/package-lock.json'

      - name: Install client frontend deps
        working-directory: ./McpSpring-client
        run: npm ci

      - name: Build McpSpring-client
        run: mvn -B -f McpSpring-client/pom.xml clean verify -DskipTests -Dvaadin.ignoreVersionChecks=true

      # 4) FrontEnd (Vaadin) bauen
      - name: Set up Node.js for FrontEnd
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'FrontEnd/package-lock.json'

      - name: Install FrontEnd frontend deps
        working-directory: ./FrontEnd
        run: npm ci

      - name: Build FrontEnd
        run: mvn -B -f FrontEnd/pom.xml clean verify -DskipTests -Dvaadin.ignoreVersionChecks=true

      # 5) Alle JARs in deploy-Ordner kopieren
      - name: Prepare deployment folder
        run: |
          mkdir deploy
          cp McpSpring-Server/target/McpSpring-Server-0.0.1-SNAPSHOT.jar deploy/
          cp McpSpring-client/target/McpSpring-client-0.0.1-SNAPSHOT.jar deploy/
          cp ChatbotAlge/target/ChatbotAlge-0.0.1-SNAPSHOT.jar deploy/
          cp FrontEnd/target/FrontEnd-0.0.1-SNAPSHOT.jar deploy/

      # 6) Artefakt hochladen
      - name: Upload app artifacts for deployment
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # nur bei push (nicht bei PR) deployen
    if: github.event_name == 'push'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app
          path: ./deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CB2AAD0F035F45AE883FA7AEFBC523E2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DCD34F2F30F24BF894A21B45E3FE070D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3097FD7CA8AD4AD8A9646409F263A46F }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'FITR'
          slot-name: 'Production'
          package: './deploy'
